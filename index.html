<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Competitor Intelligence | Odin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    
    <style>
        body { 
            font-family: 'Inter', 'Noto Sans SC', sans-serif; 
            background-color: #ffffff; 
            color: #1a1a1a; 
            -webkit-font-smoothing: antialiased; 
        }

        /* 顶部导航 Tab */
        .nav-tab {
            font-size: 0.9rem;
            color: #888;
            cursor: pointer;
            transition: color 0.2s;
            white-space: nowrap;
            padding: 4px 0;
            margin-right: 24px;
        }
        .nav-tab:hover { color: #000; }
        .nav-tab.active { color: #000; font-weight: 600; border-bottom: 2px solid #000; }

        /* 下拉框 */
        .minimal-select {
            appearance: none;
            background: transparent;
            font-size: 13px;
            color: #666;
            font-weight: 500;
            cursor: pointer;
            padding-right: 16px;
        }
        .minimal-select:hover { color: #000; }

        /* 博客流布局 */
        .feed-item {
            display: grid;
            grid-template-columns: 140px 1fr; /* 左侧元数据，右侧正文 */
            gap: 32px;
            padding: 40px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .feed-item:last-child { border-bottom: none; }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .feed-item { grid-template-columns: 1fr; gap: 12px; padding: 32px 0; }
        }

        /* 标签 */
        .tag {
            display: inline-block;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 500;
            border-radius: 4px;
            background: #f7f7f7;
            color: #666;
        }

        #loading { position: fixed; inset: 0; background:white; z-index: 50; display: flex; justify-content: center; align-items: center; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <div id="loading"><div class="w-5 h-5 border-2 border-gray-200 border-t-black rounded-full animate-spin"></div></div>

    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-gray-100">
        <div class="max-w-3xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3 flex-shrink-0 mr-8">
                <img src="./logo.png" class="h-5 w-auto grayscale opacity-90">
                <div class="h-4 w-px bg-gray-200 hidden sm:block"></div>
            </div>

            <div class="flex-1 overflow-x-auto no-scrollbar flex items-center h-16" id="topBrandNav">
                </div>

            <div class="flex-shrink-0 flex items-center gap-4">
                <div class="relative group">
                    <select id="weekFilter" onchange="renderFeed()" class="minimal-select">
                        <option value="all">All Time</option>
                    </select>
                    <svg class="w-3 h-3 absolute right-0 top-1/2 -translate-y-1/2 text-gray-400 group-hover:text-black pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 w-full max-w-3xl mx-auto px-6 py-8">
        
        <div class="mb-12 pt-4">
            <h1 class="text-3xl font-bold text-gray-900 tracking-tight mb-2" id="pageTitle">Latest Updates</h1>
            <p class="text-gray-500 text-sm" id="subtitle">Tracking competitive movements across the market.</p>
        </div>

        <div id="contentFeed">
            </div>

        <footer class="mt-20 pt-10 border-t border-gray-100 text-center pb-10">
            <p class="text-xs text-gray-400 font-mono">INTERNAL USE ONLY · ODIN INTELLIGENCE</p>
        </footer>

    </main>

    <script>
        const GOOGLE_SHEET_CSV_URL = "./data.csv"; 
        let rawData = [];
        let currentBrandFilter = 'all';

        function loadData() {
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true, header: true, skipEmptyLines: true,
                complete: (res) => {
                    rawData = res.data.map(r => ({
                        week: r['周期']||r['Week']||'', date: r['日期']||'', brand: r['竞品品牌']||'', 
                        dim: r['追踪维度（单选）']||'', fact: r['事实描述']||'', analysis: r['分析']||'', link: r['信息源']||''
                    })).filter(i => i.brand && i.fact);
                    initApp();
                }
            });
        }

        function initApp() {
            document.getElementById('loading').style.display = 'none';
            
            // 1. 生成顶部品牌 Tab
            const brands = ['All', ...new Set(rawData.map(i => i.brand))];
            const navContainer = document.getElementById('topBrandNav');
            
            brands.forEach((brand, index) => {
                const div = document.createElement('div');
                div.className = `nav-tab ${index === 0 ? 'active' : ''}`;
                div.textContent = brand;
                div.onclick = function() {
                    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentBrandFilter = brand === 'All' ? 'all' : brand;
                    
                    // 更新大标题
                    document.getElementById('pageTitle').textContent = brand === 'All' ? 'Latest Updates' : `${brand} Updates`;
                    renderFeed();
                };
                navContainer.appendChild(div);
            });

            // 2. 生成周期下拉框
            const weeks = [...new Set(rawData.map(i => i.week))].sort().reverse();
            weeks.forEach(w => document.getElementById('weekFilter').add(new Option(w, w)));

            renderFeed();
        }

        function renderFeed() {
            const wVal = document.getElementById('weekFilter').value;
            const filtered = rawData.filter(item => 
                (currentBrandFilter === 'all' || item.brand === currentBrandFilter) &&
                (wVal === 'all' || item.week === wVal)
            );
            
            document.getElementById('subtitle').textContent = `${filtered.length} posts found`;
            const container = document.getElementById('contentFeed');
            container.innerHTML = '';

            // 按周分组
            const groups = filtered.reduce((acc, curr) => { (acc[curr.week] = acc[curr.week] || []).push(curr); return acc; }, {});
            
            Object.keys(groups).sort().reverse().forEach(week => {
                // 周标题 (作为分隔符)
                const header = document.createElement('div');
                header.className = "sticky top-16 z-30 bg-white/95 py-4 mt-8 mb-2 border-b border-gray-100 text-xs font-bold text-gray-400 uppercase tracking-widest backdrop-blur";
                header.textContent = week;
                container.appendChild(header);

                groups[week].forEach(item => {
                    const linkHtml = item.link ? 
                        `<a href="${item.link}" target="_blank" class="inline-flex items-center gap-1 text-sm font-medium text-blue-600 hover:text-blue-800 hover:underline decoration-1 underline-offset-4 mt-3">
                            Read Source <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                         </a>` : '';

                    const div = document.createElement('div');
                    div.className = "feed-item group";
                    div.innerHTML = `
                        <div class="pt-1">
                            <div class="text-sm font-semibold text-gray-900 mb-1">${item.brand}</div>
                            <div class="text-xs text-gray-400 font-mono mb-3">${item.date}</div>
                            <span class="tag">${item.dim}</span>
                        </div>
                        
                        <div>
                            <h3 class="text-lg font-bold text-gray-900 leading-snug mb-3 group-hover:text-blue-600 transition-colors cursor-pointer">${item.fact}</h3>
                            
                            <div class="text-[15px] text-gray-600 leading-relaxed text-justify">
                                ${item.analysis}
                            </div>

                            ${linkHtml}
                        </div>
                    `;
                    container.appendChild(div);
                });
            });
        }

        loadData();
    </script>
</body>
</html>
