<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Competitor Intelligence | Odin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    
    <style>
        body { 
            font-family: 'Inter', 'Noto Sans SC', sans-serif; 
            background-color: #ffffff; 
            color: #1a1a1a; 
            -webkit-font-smoothing: antialiased; 
            -webkit-tap-highlight-color: transparent;
        }

        /* === 导航栏样式 === */
        .nav-tab {
            font-size: 0.9rem; 
            color: #888;
            cursor: pointer;
            transition: all 0.2s;
            padding: 4px 0;
            margin: 0 16px;
            font-weight: 500;
            position: relative;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .nav-tab:hover { color: #000; }
        .nav-tab.active { color: #000; font-weight: 600; }
        .nav-tab.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #000;
        }

        /* === 隐形下拉框 === */
        .ghost-select-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
            color: #999;
            cursor: pointer;
            transition: color 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .ghost-select-wrapper:hover { color: #000; }
        
        .ghost-select {
            appearance: none;
            background: transparent;
            border: none;
            padding-right: 18px; 
            color: inherit;
            font-family: inherit;
            font-size: inherit;
            font-weight: inherit;
            cursor: pointer;
            outline: none;
            text-align: right;
        }

        /* === 列表布局 (PC默认) === */
        .feed-item {
            display: grid;
            grid-template-columns: 140px 1fr; /* PC: 左侧元数据，右侧内容 */
            gap: 40px;
            padding: 48px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        .feed-item:last-child { border-bottom: none; }

        /* === 手机端适配的核心 CSS === */
        @media (max-width: 768px) {
            /* 导航栏变为两行 */
            .header-container {
                flex-direction: column;
                height: auto !important;
                padding-top: 12px;
                padding-bottom: 0;
            }
            
            /* 第一行：Logo 和 Filter */
            .mobile-top-row {
                width: 100%;
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 8px;
            }

            /* 第二行：导航滑动 */
            .nav-scroll-area {
                width: 100%;
                overflow-x: auto;
                display: flex;
                justify-content: flex-start !important; /* 强制左对齐 */
                padding-bottom: 12px; /* 给滚动条或下划线留空间 */
                margin: 0 -24px; /* 抵消父容器 padding */
                padding-left: 24px; /* 内容补回 padding */
                padding-right: 24px;
            }

            /* PC端的占位元素在手机端隐藏或调整 */
            .logo-area, .filter-area { width: auto !important; }
            .nav-tab { margin: 0 12px 0 0; font-size: 14px; }
            .nav-tab.active::after { bottom: 0px; }

            /* 内容流变为垂直堆叠 */
            .feed-item { 
                grid-template-columns: 1fr; /* 单列 */
                gap: 16px; 
                padding: 24px 0; 
            }
        }

        /* 标签 */
        .tag {
            display: inline-block;
            padding: 3px 8px;
            font-size: 10px;
            font-weight: 600;
            border-radius: 4px;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }
        .tag-gray { background: #f3f4f6; color: #4b5563; }
        .tag-market { background: #fff7ed; color: #c2410c; }
        .tag-product { background: #eff6ff; color: #1d4ed8; }
        .tag-strategy { background: #f5f3ff; color: #6d28d9; }

        #loading { position: fixed; inset: 0; background:white; z-index: 50; display: flex; justify-content: center; align-items: center; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <div id="loading"><div class="w-5 h-5 border-2 border-gray-100 border-t-black rounded-full animate-spin"></div></div>

    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-gray-100">
        <div class="header-container max-w-6xl mx-auto px-6 h-16 flex items-center justify-between relative">
            
            <div class="mobile-top-row md:contents">
                
                <div class="logo-area md:w-32 flex-shrink-0 flex items-center">
                    <img src="./logo.png" class="h-6 w-auto object-contain">
                </div>

                <div class="filter-area md:w-32 flex justify-end flex-shrink-0">
                    <div class="ghost-select-wrapper">
                        <select id="weekFilter" onchange="renderFeed()" class="ghost-select">
                            <option value="all">All Time</option>
                        </select>
                        <svg class="w-3 h-3 absolute right-0 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>

            </div>

            <div class="nav-scroll-area flex-1 flex justify-center md:overflow-visible no-scrollbar" id="topBrandNav">
                </div>

        </div>
    </header>

    <main class="flex-1 w-full max-w-4xl mx-auto px-6">
        
        <div id="contentFeed">
            </div>

        <footer class="mt-24 pt-12 border-t border-gray-50 text-center pb-12">
            <p class="text-[10px] text-gray-300 font-mono tracking-widest uppercase">Internal Intelligence System</p>
        </footer>

    </main>

    <script>
        const GOOGLE_SHEET_CSV_URL = "./data.csv"; 
        let rawData = [];
        let currentBrandFilter = 'all';

        function loadData() {
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true, header: true, skipEmptyLines: true,
                complete: (res) => {
                    rawData = res.data.map(r => ({
                        week: r['周期']||r['Week']||'', date: r['日期']||'', brand: r['竞品品牌']||'', 
                        dim: r['追踪维度（单选）']||'', fact: r['事实描述']||'', analysis: r['分析']||'', link: r['信息源']||''
                    })).filter(i => i.brand && i.fact);
                    initApp();
                }
            });
        }

        function initApp() {
            document.getElementById('loading').style.display = 'none';
            
            const brands = ['All', ...new Set(rawData.map(i => i.brand))];
            const navContainer = document.getElementById('topBrandNav');
            
            brands.forEach((brand, index) => {
                const div = document.createElement('div');
                div.className = `nav-tab ${index === 0 ? 'active' : ''}`;
                div.textContent = brand;
                div.onclick = function(e) {
                    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentBrandFilter = brand === 'All' ? 'all' : brand;
                    renderFeed();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    
                    // 手机端点击后，让选中的项滚到中间 (简单优化)
                    e.target.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                };
                navContainer.appendChild(div);
            });

            const weeks = [...new Set(rawData.map(i => i.week))].sort().reverse();
            weeks.forEach(w => document.getElementById('weekFilter').add(new Option(w, w)));

            renderFeed();
        }

        function renderFeed() {
            const wVal = document.getElementById('weekFilter').value;
            const filtered = rawData.filter(item => 
                (currentBrandFilter === 'all' || item.brand === currentBrandFilter) &&
                (wVal === 'all' || item.week === wVal)
            );
            
            const container = document.getElementById('contentFeed');
            container.innerHTML = '';

            if (filtered.length === 0) {
                container.innerHTML = `<div class="py-32 text-center text-gray-300 text-sm font-mono">No intelligence found.</div>`;
                return;
            }

            const groups = filtered.reduce((acc, curr) => { (acc[curr.week] = acc[curr.week] || []).push(curr); return acc; }, {});
            
            Object.keys(groups).sort().reverse().forEach((week, idx) => {
                // 动态计算 Sticky 头部的高度位置
                // 手机端 Header 变高了，所以 sticky 位置要调整，简单起见这里用稍大的值兼容
                const header = document.createElement('div');
                header.className = `sticky top-24 md:top-[63px] z-30 bg-white/95 py-3 mb-4 border-b border-gray-100 text-[10px] font-bold text-gray-400 uppercase tracking-widest backdrop-blur ${idx > 0 ? 'mt-8' : 'mt-4'}`;
                header.textContent = week;
                container.appendChild(header);

                groups[week].forEach(item => {
                    // 标签颜色
                    let tagClass = 'tag-gray';
                    const dim = item.dim;
                    if (dim.includes('市场') || dim.includes('营销')) tagClass = 'tag-market';
                    else if (dim.includes('产品') || dim.includes('技术')) tagClass = 'tag-product';
                    else if (dim.includes('战略') || dim.includes('公司')) tagClass = 'tag-strategy';

                    const linkHtml = item.link ? 
                        `<a href="${item.link}" target="_blank" class="inline-flex items-center gap-1 text-xs font-semibold text-gray-900 hover:text-blue-600 transition-colors mt-4 border-b border-black hover:border-blue-600 pb-px">
                            Read Source ↗
                         </a>` : '';

                    const div = document.createElement('div');
                    div.className = "feed-item group";
                    div.innerHTML = `
                        <div class="pt-1 flex flex-row md:flex-col items-center md:items-start gap-2 md:gap-0">
                            <div class="text-sm font-bold text-gray-900 md:mb-1">${item.brand}</div>
                            
                            <div class="hidden md:block text-xs text-gray-400 font-mono mb-3">${item.date}</div>
                            
                            <div class="md:hidden text-xs text-gray-400 font-mono">• ${item.date.slice(5)}</div>
                            
                            <span class="tag ${tagClass} ml-auto md:ml-0">${item.dim}</span>
                        </div>
                        
                        <div>
                            <h3 class="text-lg md:text-xl font-bold text-gray-900 leading-tight mb-3 group-hover:text-blue-600 transition-colors cursor-pointer">${item.fact}</h3>
                            
                            <div class="text-sm md:text-[15px] text-gray-600 leading-relaxed text-justify font-light">
                                ${item.analysis}
                            </div>

                            ${linkHtml}
                        </div>
                    `;
                    container.appendChild(div);
                });
            });
        }

        loadData();
    </script>
</body>
</html>
