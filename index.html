<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Competitor Intelligence | Odin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    
    <style>
        body { 
            font-family: 'Inter', 'Noto Sans SC', sans-serif; 
            background-color: #ffffff; 
            color: #1a1a1a; 
            -webkit-font-smoothing: antialiased; 
        }

        /* 顶部导航 Tab - 居中纯文字风格 */
        .nav-tab {
            font-size: 0.9rem; 
            color: #888;
            cursor: pointer;
            transition: all 0.2s;
            padding: 4px 0;
            margin: 0 16px; /* 增加间距 */
            font-weight: 500;
            position: relative;
        }
        .nav-tab:hover { color: #000; }
        .nav-tab.active { color: #000; font-weight: 600; }
        /* 选中时底部的小黑条 */
        .nav-tab.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #000;
        }

        /* 隐形下拉框 (Ghost Select) */
        .ghost-select-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
            color: #999;
            cursor: pointer;
            transition: color 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .ghost-select-wrapper:hover { color: #000; }
        
        .ghost-select {
            appearance: none;
            background: transparent;
            border: none;
            padding-right: 18px; /* 为箭头留空 */
            color: inherit;
            font-family: inherit;
            font-size: inherit;
            font-weight: inherit;
            cursor: pointer;
            outline: none;
            text-align: right;
        }

        /* 博客流布局 */
        .feed-item {
            display: grid;
            grid-template-columns: 120px 1fr; 
            gap: 40px;
            padding: 48px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        .feed-item:last-child { border-bottom: none; }

        @media (max-width: 768px) {
            .feed-item { grid-template-columns: 1fr; gap: 12px; padding: 32px 0; }
            /* 移动端隐藏两侧，只留中间 Nav */
            .nav-center-layout { justify-content: flex-start; overflow-x: auto; }
            .logo-area, .filter-area { display: none; } 
        }

        /* 标签 */
        .tag {
            display: inline-block;
            padding: 3px 8px;
            font-size: 10px;
            font-weight: 600;
            border-radius: 4px;
            background: #f0f0f0;
            color: #666;
            letter-spacing: 0.02em;
        }

        #loading { position: fixed; inset: 0; background:white; z-index: 50; display: flex; justify-content: center; align-items: center; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <div id="loading"><div class="w-5 h-5 border-2 border-gray-100 border-t-black rounded-full animate-spin"></div></div>

    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-gray-100 h-16">
        <div class="max-w-6xl mx-auto px-6 h-full flex items-center justify-between nav-center-layout relative">
            
            <div class="logo-area w-32 flex-shrink-0">
                <img src="./logo.png" class="h-6 w-auto">
            </div>

            <div class="flex-1 flex justify-center overflow-x-auto no-scrollbar" id="topBrandNav">
                </div>

            <div class="filter-area w-32 flex justify-end flex-shrink-0">
                <div class="ghost-select-wrapper">
                    <select id="weekFilter" onchange="renderFeed()" class="ghost-select">
                        <option value="all">All Time</option>
                    </select>
                    <svg class="w-3 h-3 absolute right-0 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
            </div>

        </div>
    </header>

    <main class="flex-1 w-full max-w-4xl mx-auto px-6">
        
        <div id="contentFeed">
            </div>

        <footer class="mt-24 pt-12 border-t border-gray-50 text-center pb-12">
            <p class="text-[10px] text-gray-300 font-mono tracking-widest uppercase">Internal Intelligence System</p>
        </footer>

    </main>

    <script>
        const GOOGLE_SHEET_CSV_URL = "./data.csv"; 
        let rawData = [];
        let currentBrandFilter = 'all';

        function loadData() {
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true, header: true, skipEmptyLines: true,
                complete: (res) => {
                    rawData = res.data.map(r => ({
                        week: r['周期']||r['Week']||'', date: r['日期']||'', brand: r['竞品品牌']||'', 
                        dim: r['追踪维度（单选）']||'', fact: r['事实描述']||'', analysis: r['分析']||'', link: r['信息源']||''
                    })).filter(i => i.brand && i.fact);
                    initApp();
                }
            });
        }

        function initApp() {
            document.getElementById('loading').style.display = 'none';
            
            // 1. 生成顶部品牌 Tab
            const brands = ['All', ...new Set(rawData.map(i => i.brand))];
            const navContainer = document.getElementById('topBrandNav');
            
            brands.forEach((brand, index) => {
                const div = document.createElement('div');
                div.className = `nav-tab ${index === 0 ? 'active' : ''}`;
                div.textContent = brand;
                div.onclick = function() {
                    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentBrandFilter = brand === 'All' ? 'all' : brand;
                    renderFeed();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                navContainer.appendChild(div);
            });

            // 2. 生成周期下拉框
            const weeks = [...new Set(rawData.map(i => i.week))].sort().reverse();
            weeks.forEach(w => document.getElementById('weekFilter').add(new Option(w, w)));

            renderFeed();
        }

        function renderFeed() {
            const wVal = document.getElementById('weekFilter').value;
            const filtered = rawData.filter(item => 
                (currentBrandFilter === 'all' || item.brand === currentBrandFilter) &&
                (wVal === 'all' || item.week === wVal)
            );
            
            const container = document.getElementById('contentFeed');
            container.innerHTML = '';

            if (filtered.length === 0) {
                container.innerHTML = `<div class="py-32 text-center text-gray-300 text-sm font-mono">No intelligence found.</div>`;
                return;
            }

            // 按周分组
            const groups = filtered.reduce((acc, curr) => { (acc[curr.week] = acc[curr.week] || []).push(curr); return acc; }, {});
            
            Object.keys(groups).sort().reverse().forEach((week, idx) => {
                // 周标题 (只有第一个之后才显示上边距，避免顶部留白太多)
                const header = document.createElement('div');
                header.className = `sticky top-[63px] z-30 bg-white/95 py-3 mb-4 border-b border-gray-100 text-[10px] font-bold text-gray-400 uppercase tracking-widest backdrop-blur ${idx > 0 ? 'mt-8' : 'mt-4'}`;
                header.textContent = week;
                container.appendChild(header);

                groups[week].forEach(item => {
                    const linkHtml = item.link ? 
                        `<a href="${item.link}" target="_blank" class="inline-flex items-center gap-1 text-xs font-semibold text-gray-900 hover:text-blue-600 transition-colors mt-4 border-b border-black hover:border-blue-600 pb-px">
                            Read Source ↗
                         </a>` : '';

                    const div = document.createElement('div');
                    div.className = "feed-item group";
                    div.innerHTML = `
                        <div class="pt-1">
                            <div class="text-sm font-bold text-gray-900 mb-1">${item.brand}</div>
                            <div class="text-xs text-gray-400 font-mono mb-3">${item.date}</div>
                            <span class="tag">${item.dim}</span>
                        </div>
                        
                        <div>
                            <h3 class="text-xl font-bold text-gray-900 leading-tight mb-3 group-hover:text-blue-600 transition-colors cursor-pointer">${item.fact}</h3>
                            
                            <div class="text-[15px] text-gray-600 leading-relaxed text-justify font-light">
                                ${item.analysis}
                            </div>

                            ${linkHtml}
                        </div>
                    `;
                    container.appendChild(div);
                });
            });
        }

        loadData();
    </script>
</body>
</html>
