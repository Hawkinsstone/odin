<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Competitor Intelligence | Odin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    
    <style>
        body { 
            font-family: 'Inter', 'Noto Sans SC', sans-serif; 
            background-color: #ffffff; 
            color: #1a1a1a; 
            -webkit-font-smoothing: antialiased; 
            -webkit-tap-highlight-color: transparent;
        }

        /* === 第一排：品牌导航 (Tab) === */
        .nav-tab {
            font-size: 0.9rem; 
            color: #888;
            cursor: pointer;
            transition: all 0.2s;
            padding: 4px 0;
            margin: 0 12px;
            font-weight: 500;
            position: relative;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .nav-tab:hover { color: #000; }
        .nav-tab.active { color: #000; font-weight: 600; }
        .nav-tab.active::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #000;
        }

        /* === 第二排：时间轴滑动条 (Timeline) === */
        .timeline-item {
            font-size: 0.75rem; 
            color: #9ca3af; 
            cursor: pointer;
            padding: 6px 16px;
            border-radius: 99px;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: 'Inter', 'Noto Sans SC', sans-serif; 
            letter-spacing: 0.05em;
            position: relative;
            flex-shrink: 0;
        }
        .timeline-item:hover { color: #374151; }
        
        .timeline-item.active {
            color: #000;
            font-weight: 700;
            background-color: #f3f4f6;
        }
        .timeline-item.active::before {
            content: '•';
            margin-right: 6px;
            color: #2563eb; 
        }

        /* === 列表布局 === */
        .feed-item {
            display: grid;
            grid-template-columns: 140px 1fr; 
            gap: 40px;
            padding: 40px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        .feed-item:last-child { border-bottom: none; }

        /* === 手机端适配 === */
        @media (max-width: 768px) {
            .logo-area { display: none; } 
            .spacer-area { display: none; }
            .nav-center-layout { justify-content: flex-start; padding-left: 16px; }
            .nav-tab { font-size: 1rem; margin-right: 24px; }
            .nav-tab.active::after { bottom: -12px; }
            .feed-item { grid-template-columns: 1fr; gap: 12px; padding: 24px 0; }
            
            /* 手机端时间轴也要靠左，方便滑动 */
            .timeline-center-layout { justify-content: flex-start !important; padding-left: 16px; padding-right: 16px; }
        }

        /* 标签颜色 */
        .tag {
            display: inline-block;
            padding: 3px 8px;
            font-size: 10px;
            font-weight: 600;
            border-radius: 4px;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }
        .tag-gray { background: #f3f4f6; color: #4b5563; }
        .tag-market { background: #fff7ed; color: #c2410c; }
        .tag-product { background: #eff6ff; color: #1d4ed8; }
        .tag-strategy { background: #f5f3ff; color: #6d28d9; }

        #loading { position: fixed; inset: 0; background:white; z-index: 100; display: flex; justify-content: center; align-items: center; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-white">

    <div id="loading"><div class="w-5 h-5 border-2 border-gray-100 border-t-black rounded-full animate-spin"></div></div>

    <div class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-gray-100">
        
        <div class="h-16 border-b border-gray-50">
            <div class="max-w-4xl mx-auto h-full flex items-center justify-between relative">
                <div class="logo-area w-[180px] flex-shrink-0 flex items-center pl-6 cursor-pointer group" onclick="resetAll()">
                    <img src="./logo.png" class="h-6 w-auto object-contain opacity-100 transition-opacity group-hover:opacity-80">
                </div>

                <div class="flex-1 flex justify-center overflow-x-auto hide-scroll h-full items-center nav-center-layout" id="topBrandNav">
                    </div>

                <div class="spacer-area w-[180px] flex-shrink-0"></div>
            </div>
        </div>

        <div class="h-12 bg-white">
            <div class="max-w-4xl mx-auto h-full flex items-center justify-center overflow-x-auto hide-scroll timeline-center-layout" id="timelineContainer">
                </div>
        </div>
    </div>

    <main class="flex-1 w-full max-w-4xl mx-auto px-6 pb-20">
        <div id="contentFeed"></div>
        
        <footer class="mt-16 pt-12 border-t border-gray-50 text-center text-gray-400">
            <div class="text-[10px] font-mono tracking-widest uppercase mb-2">Internal Intelligence System</div>
            <div class="text-[10px] font-medium text-gray-300">Design by Stone</div>
        </footer>
    </main>

    <script>
        const GOOGLE_SHEET_CSV_URL = "./data.csv"; 
        let rawData = [];
        let currentBrandFilter = 'all';
        let currentWeekFilter = 'all';

        function loadData() {
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true, header: true, skipEmptyLines: true,
                complete: (res) => {
                    rawData = res.data.map(r => {
                        // 1. 数据清洗：品牌修正
                        let brandName = r['竞品品牌']||r['Brand']||'';
                        if (brandName === '华三') brandName = '新华三'; // 强制修正
                        
                        // 2. 数据清洗：日期格式化 (处理时间戳)
                        let dateStr = r['日期']||r['Date']||'';
                        // 如果全是数字且长度大于8 (假设是毫秒时间戳)
                        if (/^\d{8,}$/.test(dateStr)) {
                            const dateObj = new Date(parseInt(dateStr));
                            if (!isNaN(dateObj.getTime())) {
                                const y = dateObj.getFullYear();
                                const m = String(dateObj.getMonth() + 1).padStart(2, '0');
                                const d = String(dateObj.getDate()).padStart(2, '0');
                                dateStr = `${y}-${m}-${d}`;
                            }
                        }

                        return {
                            week: r['周期']||r['Week']||'', 
                            date: dateStr, 
                            brand: brandName, 
                            dim: r['追踪维度（单选）']||'', 
                            fact: r['事实描述']||'', 
                            analysis: r['分析']||'', 
                            link: r['信息源']||''
                        };
                    }).filter(i => i.brand && i.fact);
                    
                    initApp();
                }
            });
        }

        function initApp() {
            document.getElementById('loading').style.display = 'none';
            renderNavs();
            renderFeed();
        }

        // 渲染导航栏 (拆分出来方便重置)
        function renderNavs() {
            // 1. 品牌导航
            const brands = ['All', ...new Set(rawData.map(i => i.brand))];
            const navContainer = document.getElementById('topBrandNav');
            navContainer.innerHTML = ''; // 清空
            
            brands.forEach((brand, index) => {
                const div = document.createElement('div');
                // 如果是 'All' 且当前是 'all'，或者具体品牌匹配
                const isActive = (brand === 'All' && currentBrandFilter === 'all') || (brand === currentBrandFilter);
                div.className = `nav-tab ${isActive ? 'active' : ''}`;
                div.textContent = brand === 'All' ? '全部品牌' : brand; // 汉化
                div.onclick = function(e) {
                    currentBrandFilter = brand === 'All' ? 'all' : brand;
                    renderNavs(); // 重新渲染以更新 active 状态
                    renderFeed();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    e.target.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                };
                navContainer.appendChild(div);
            });

            // 2. 时间轴
            const weeks = [...new Set(rawData.map(i => i.week))].sort().reverse();
            const tlContainer = document.getElementById('timelineContainer');
            tlContainer.innerHTML = ''; // 清空

            // 全部按钮
            addTimelineItem(tlContainer, '全部', 'all', currentWeekFilter === 'all');
            
            // 分隔线
            const divider = document.createElement('div');
            divider.className = "h-4 w-px bg-gray-200 mx-2 flex-shrink-0";
            tlContainer.appendChild(divider);

            // 周次按钮
            weeks.forEach(week => {
                addTimelineItem(tlContainer, week, week, currentWeekFilter === week);
            });
        }

        function addTimelineItem(container, text, value, isActive) {
            const btn = document.createElement('div');
            btn.className = `timeline-item ${isActive ? 'active' : ''}`;
            btn.textContent = text;
            btn.onclick = function(e) {
                currentWeekFilter = value;
                renderNavs(); // 更新选中态
                renderFeed();
                window.scrollTo({ top: 0, behavior: 'smooth' });
                e.target.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            };
            container.appendChild(btn);
        }

        // 重置所有筛选 (Logo点击触发)
        function resetAll() {
            currentBrandFilter = 'all';
            currentWeekFilter = 'all';
            renderNavs();
            renderFeed();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderFeed() {
            const filtered = rawData.filter(item => 
                (currentBrandFilter === 'all' || item.brand === currentBrandFilter) &&
                (currentWeekFilter === 'all' || item.week === currentWeekFilter)
            );
            
            const container = document.getElementById('contentFeed');
            container.innerHTML = '';

            if (filtered.length === 0) {
                container.innerHTML = `<div class="py-32 text-center text-gray-300 text-sm font-mono">暂无相关情报数据</div>`;
                return;
            }

            const groups = filtered.reduce((acc, curr) => { (acc[curr.week] = acc[curr.week] || []).push(curr); return acc; }, {});
            
            Object.keys(groups).sort().reverse().forEach((week, idx) => {
                if (currentWeekFilter === 'all') {
                    const header = document.createElement('div');
                    header.className = `py-3 mb-4 border-b border-gray-100 text-[11px] font-bold text-gray-400 uppercase tracking-widest ${idx > 0 ? 'mt-12' : 'mt-6'}`;
                    header.textContent = week;
                    container.appendChild(header);
                } else if (idx === 0) {
                     const spacer = document.createElement('div');
                     spacer.className = "mt-8";
                     container.appendChild(spacer);
                }

                groups[week].forEach(item => {
                    let tagClass = 'tag-gray';
                    const dim = item.dim || '';
                    if (dim.includes('市场') || dim.includes('营销')) tagClass = 'tag-market';
                    else if (dim.includes('产品') || dim.includes('技术')) tagClass = 'tag-product';
                    else if (dim.includes('战略') || dim.includes('公司')) tagClass = 'tag-strategy';

                    const linkHtml = item.link ? 
                        `<a href="${item.link}" target="_blank" class="inline-flex items-center gap-1 text-xs font-semibold text-gray-900 hover:text-blue-600 transition-colors mt-4 border-b border-black hover:border-blue-600 pb-px">
                            Read Source ↗
                         </a>` : '';

                    const div = document.createElement('div');
                    div.className = "feed-item group";
                    div.innerHTML = `
                        <div class="pt-1">
                            <div class="text-sm font-bold text-gray-900 mb-1">${item.brand}</div>
                            <div class="text-xs text-gray-400 font-mono mb-3">${item.date}</div>
                            <span class="tag ${tagClass}">${item.dim}</span>
                        </div>
                        
                        <div>
                            <h3 class="text-lg md:text-xl font-bold text-gray-900 leading-tight mb-3 group-hover:text-blue-600 transition-colors cursor-pointer">${item.fact}</h3>
                            <div class="text-sm md:text-[15px] text-gray-600 leading-relaxed text-justify font-light">
                                ${item.analysis}
                            </div>
                            ${linkHtml}
                        </div>
                    `;
                    container.appendChild(div);
                });
            });
        }

        loadData();
    </script>
</body>
</html>
