<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>竞品追踪周报 | 欧帝科技</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    
    <style>
        body { 
            font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif; 
            background-color: #f8fafc; 
            color: #334155; 
            -webkit-font-smoothing: antialiased;
        }
        .glass-nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.6);
        }
        .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-3px); box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.08); border-color: #cbd5e1; }
        
        /* 自定义下拉菜单样式 - 核心优化 */
        .custom-select-wrapper { position: relative; }
        .custom-select {
            appearance: none;
            -webkit-appearance: none;
            background-color: #f1f5f9; /* Slate-100 */
            border: 1px solid transparent;
            padding: 8px 36px 8px 16px;
            border-radius: 9999px; /* 胶囊形状 */
            font-size: 0.875rem;
            font-weight: 500;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.5;
        }
        .custom-select:hover { background-color: #e2e8f0; color: #1e293b; }
        .custom-select:focus { outline: none; background-color: #fff; border-color: #f97316; box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1); }
        
        /* 自定义箭头 */
        .select-arrow {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #94a3b8;
        }

        .tag-base { font-size: 0.75rem; padding: 2px 8px; border-radius: 6px; font-weight: 600; letter-spacing: 0.02em; }
        .tag-strategy { background-color: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; } 
        .tag-product { background-color: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; } 
        .tag-market { background-color: #fff7ed; color: #ea580c; border: 1px solid #fed7aa; } 
        .brand-badge { font-weight: 600; border-radius: 6px; padding: 3px 10px; font-size: 0.75rem; display: inline-flex; align-items: center; }

        #loading { position: fixed; inset: 0; background:#f8fafc; display:flex; justify-content:center; align-items:center; z-index:100; }
        .loader { width: 40px; height: 40px; border: 3px solid #e2e8f0; border-top-color: #f97316; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="antialiased selection:bg-orange-100 selection:text-orange-600">

    <div id="loading">
        <div class="flex flex-col items-center gap-3">
            <div class="loader"></div>
            <div class="text-slate-400 text-sm font-medium animate-pulse">读取数据中...</div>
        </div>
    </div>

    <header class="glass-nav sticky top-0 z-50 w-full">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <img src="./logo.png" alt="欧帝科技" class="h-7 w-auto object-contain opacity-95 hover:opacity-100 transition-opacity cursor-pointer">
                <div class="h-4 w-[1.5px] bg-slate-200 rotate-12 hidden sm:block"></div>
                <div class="flex items-baseline gap-3">
                    <h1 class="text-lg font-bold text-slate-800 tracking-tight">竞品追踪周报</h1>
                    <span id="dateRange" class="hidden sm:inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-500 border border-slate-200">--/--</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-2 bg-white border border-slate-200 px-3 py-1 rounded-full shadow-sm">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                    </span>
                    <span class="text-xs font-medium text-slate-500" id="updateTime">同步中...</span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-slate-100">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wider flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-blue-500"></div>
                        声量分布
                    </h3>
                </div>
                <div class="h-56"><canvas id="brandChart"></canvas></div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-slate-100">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wider flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-orange-500"></div>
                        维度占比
                    </h3>
                </div>
                <div class="h-56"><canvas id="dimensionChart"></canvas></div>
            </div>
        </div>

        <div class="bg-white p-2 rounded-2xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] border border-slate-100 mb-8 sticky top-20 z-40 flex flex-wrap items-center justify-between gap-4">
            
            <div class="flex items-center gap-2 flex-wrap px-2">
                <div class="flex items-center text-slate-400 mr-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                </div>

                <div class="custom-select-wrapper">
                    <select id="weekFilter" onchange="renderCards()" class="custom-select pr-10">
                        <option value="all">📅 全部周期</option>
                    </select>
                    <svg class="select-arrow w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>

                <div class="custom-select-wrapper">
                    <select id="brandFilter" onchange="renderCards()" class="custom-select pr-10">
                        <option value="all">🏢 全部品牌</option>
                    </select>
                    <svg class="select-arrow w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>

                <div class="custom-select-wrapper">
                    <select id="typeFilter" onchange="renderCards()" class="custom-select pr-10">
                        <option value="all">🎯 全部维度</option>
                        <option value="产品与技术">产品与技术</option>
                        <option value="市场与营销">市场与营销</option>
                        <option value="公司与战略">公司与战略</option>
                    </select>
                    <svg class="select-arrow w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
            </div>
            
            <div class="flex items-center gap-4 px-4 border-l border-slate-100 h-8">
                <div class="flex flex-col items-end leading-none">
                    <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Items</span>
                    <span id="countDisplay" class="text-lg font-bold text-slate-800 font-mono">0</span>
                </div>
            </div>
        </div>

        <div id="contentFeed" class="space-y-12"></div>

        <footer class="mt-20 pb-8 text-center">
            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white border border-slate-100 shadow-sm">
                <span class="w-1.5 h-1.5 rounded-full bg-slate-300"></span>
                <p class="text-xs text-slate-400 font-medium">Internal Use Only · 欧帝科技市场部</p>
            </div>
        </footer>
    </main>

    <script>
        // 🔴 数据源配置
        const GOOGLE_SHEET_CSV_URL = "./data.csv"; 

        let rawData = [];

        function loadData() {
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    rawData = results.data.map(row => ({
                        week: row['周期'] || row['Week'] || '未知',
                        date: row['日期'] || row['Date'] || '',
                        brand: row['竞品品牌'] || row['Brand'] || '其他',
                        dim: row['追踪维度（单选）'] || row['Dimension'] || '其他',
                        fact: row['事实描述'] || row['Fact'] || '无描述',
                        analysis: row['分析'] || row['Analysis'] || '',
                        link: row['信息源'] || row['Link'] || ''
                    })).filter(item => item.brand && item.fact);

                    initApp();
                },
                error: function(err) { console.error(err); }
            });
        }

        function initApp() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('updateTime').textContent = "Updated: " + new Date().toLocaleDateString(undefined, {month:'short', day:'numeric'});

            const weeks = [...new Set(rawData.map(i => i.week))].sort().reverse();
            const brands = [...new Set(rawData.map(i => i.brand))];
            
            const wSelect = document.getElementById('weekFilter');
            weeks.forEach(w => wSelect.add(new Option(w, w)));
            
            const bSelect = document.getElementById('brandFilter');
            brands.forEach(b => bSelect.add(new Option(b, b)));

            if(weeks.length > 0) document.getElementById('dateRange').textContent = `${weeks[weeks.length-1]} ~ ${weeks[0]}`;

            renderCharts();
            renderCards();
        }

        function renderCharts() {
            const brandCounts = {};
            rawData.forEach(i => brandCounts[i.brand] = (brandCounts[i.brand] || 0) + 1);
            const dimCounts = {};
            rawData.forEach(i => dimCounts[i.dim] = (dimCounts[i.dim] || 0) + 1);

            new Chart(document.getElementById('brandChart'), {
                type: 'bar',
                data: {
                    labels: Object.keys(brandCounts),
                    datasets: [{
                        label: 'Count',
                        data: Object.values(brandCounts),
                        backgroundColor: '#3b82f6',
                        borderRadius: 4,
                        barThickness: 24
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#f1f5f9' }, border: { display: false } },
                        x: { grid: { display: false }, border: { display: false } }
                    }
                }
            });

            new Chart(document.getElementById('dimensionChart'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(dimCounts),
                    datasets: [{
                        data: Object.values(dimCounts),
                        backgroundColor: ['#22c55e', '#f97316', '#3b82f6'], 
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '75%',
                    plugins: { legend: { position: 'right', labels: { usePointStyle: true, pointStyle: 'circle', font: { size: 11 } } } }
                }
            });
        }

        function renderCards() {
            const weekVal = document.getElementById('weekFilter').value;
            const brandVal = document.getElementById('brandFilter').value;
            const typeVal = document.getElementById('typeFilter').value;
            const container = document.getElementById('contentFeed');
            container.innerHTML = '';

            const filtered = rawData.filter(item => 
                (weekVal === 'all' || item.week === weekVal) &&
                (brandVal === 'all' || item.brand === brandVal) &&
                (typeVal === 'all' || item.dim === typeVal)
            );

            document.getElementById('countDisplay').textContent = filtered.length;

            const groups = filtered.reduce((acc, curr) => { (acc[curr.week] = acc[curr.week] || []).push(curr); return acc; }, {});
            
            Object.keys(groups).sort().reverse().forEach(week => {
                const header = document.createElement('div');
                header.className = "flex items-center space-x-3 mt-4 mb-6";
                header.innerHTML = `
                    <span class="bg-slate-800 text-white text-xs font-bold px-3 py-1.5 rounded-md shadow-sm tracking-wide">${week}</span>
                    <div class="h-px bg-slate-200 flex-grow"></div>
                `;
                container.appendChild(header);

                const grid = document.createElement('div');
                grid.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6";
                
                groups[week].forEach(item => {
                    let brandStyle = 'bg-slate-100 text-slate-600 border-slate-200';
                    if(['华为','新华三'].some(k=>item.brand.includes(k))) brandStyle = 'bg-rose-50 text-rose-600 border-rose-100';
                    if(['腾讯','浪潮'].some(k=>item.brand.includes(k))) brandStyle = 'bg-blue-50 text-blue-600 border-blue-100';
                    if(['阿里','金智'].some(k=>item.brand.includes(k))) brandStyle = 'bg-orange-50 text-orange-600 border-orange-100';
                    if(['字节','联想'].some(k=>item.brand.includes(k))) brandStyle = 'bg-cyan-50 text-cyan-600 border-cyan-100';

                    let dimClass = 'tag-market';
                    if(item.dim.includes('战略')) dimClass = 'tag-strategy';
                    if(item.dim.includes('产品')) dimClass = 'tag-product';

                    const linkHtml = item.link ? 
                        `<a href="${item.link}" target="_blank" class="inline-flex items-center text-xs font-semibold text-blue-600 hover:text-orange-500 transition-colors mt-4 pt-4 border-t border-slate-50 w-full">
                            阅读详情 <svg class="w-3 h-3 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                         </a>` : '';

                    const card = document.createElement('div');
                    card.className = "bg-white rounded-xl p-6 border border-slate-100 shadow-sm card-hover flex flex-col h-full relative overflow-hidden group";
                    card.innerHTML = `
                        <div class="absolute top-0 left-0 w-1 h-full ${dimClass.replace(/bg-|text-|border-/g, '').includes('green') ? 'bg-green-500' : (dimClass.includes('blue') ? 'bg-blue-500' : 'bg-orange-500')} opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        
                        <div class="flex justify-between items-start mb-4">
                            <span class="brand-badge border ${brandStyle}">${item.brand}</span>
                            <span class="tag-base ${dimClass}">${item.dim}</span>
                        </div>
                        
                        <h4 class="text-[15px] font-bold text-slate-800 leading-relaxed mb-3 line-clamp-2 group-hover:text-orange-600 transition-colors" title="${item.fact}">${item.fact}</h4>
                        
                        <div class="bg-slate-50/80 p-3 rounded-lg border border-slate-100/50 mb-auto">
                            <p class="text-xs leading-relaxed text-slate-500 text-justify">${item.analysis}</p>
                        </div>

                        ${linkHtml}

                        <div class="mt-3 flex items-center justify-end text-[10px] text-slate-300 font-medium">
                           ${item.date}
                        </div>
                    `;
                    grid.appendChild(card);
                });
                container.appendChild(grid);
            });
        }

        loadData();
    </script>
</body>
</html>
