<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Competitor Intelligence | Odin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    
    <style>
        body { 
            font-family: 'Inter', 'Noto Sans SC', sans-serif; 
            background-color: #ffffff; 
            color: #1a1a1a; 
            -webkit-font-smoothing: antialiased; 
        }

        /* 顶部导航 Tab - 单行滑动 */
        .nav-tab {
            font-size: 0.9rem; 
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
            padding: 8px 16px; /* 增加一点点击面积 */
            border-radius: 6px;
            font-weight: 500;
            white-space: nowrap; /* 强制不换行 */
            flex-shrink: 0; /* 防止被挤压 */
        }
        .nav-tab:hover { 
            color: #000; 
            background-color: #f5f5f5; 
        }
        .nav-tab.active { 
            color: #000; 
            font-weight: 600; 
            background-color: #f3f4f6; 
        }

        /* 下拉框 - 移到内容区后的样式 */
        .content-filter-select {
            appearance: none;
            background: #fff;
            border: 1px solid #eee;
            font-size: 12px;
            color: #666;
            font-weight: 500;
            cursor: pointer;
            padding: 6px 24px 6px 10px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .content-filter-select:hover { border-color: #ccc; color: #000; }

        /* 博客流布局 */
        .feed-item {
            display: grid;
            grid-template-columns: 140px 1fr; 
            gap: 32px;
            padding: 40px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .feed-item:last-child { border-bottom: none; }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .feed-item { grid-template-columns: 1fr; gap: 12px; padding: 32px 0; }
        }

        /* 标签 */
        .tag {
            display: inline-block;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 500;
            border-radius: 4px;
            background: #f7f7f7;
            color: #666;
        }

        #loading { position: fixed; inset: 0; background:white; z-index: 50; display: flex; justify-content: center; align-items: center; }
        
        /* 隐藏滚动条 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <div id="loading"><div class="w-5 h-5 border-2 border-gray-200 border-t-black rounded-full animate-spin"></div></div>

    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-gray-100 h-16">
        <div class="w-full h-full px-4 md:px-8 flex items-center overflow-hidden">
            
            <div class="flex items-center gap-4 flex-shrink-0 mr-6 z-10 bg-white/95 pr-4 border-r border-gray-100/50">
                <img src="./logo.png" class="h-6 w-auto"> 
            </div>

            <div class="flex-1 overflow-x-auto no-scrollbar flex items-center gap-1 h-full mask-fade-right" id="topBrandNav">
                </div>

            </div>
    </header>

    <main class="flex-1 w-full max-w-4xl mx-auto px-6 py-6">
        
        <div class="flex justify-end items-center mb-4 pb-4 border-b border-dashed border-gray-100">
            <div class="relative group">
                <select id="weekFilter" onchange="renderFeed()" class="content-filter-select">
                    <option value="all">All Time</option>
                </select>
                <svg class="w-3 h-3 absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </div>
        </div>

        <div id="contentFeed">
            </div>

        <footer class="mt-20 pt-10 border-t border-gray-100 text-center pb-10">
            <p class="text-xs text-gray-400 font-mono">INTERNAL USE ONLY · ODIN INTELLIGENCE</p>
        </footer>

    </main>

    <script>
        const GOOGLE_SHEET_CSV_URL = "./data.csv"; 
        let rawData = [];
        let currentBrandFilter = 'all';

        function loadData() {
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true, header: true, skipEmptyLines: true,
                complete: (res) => {
                    rawData = res.data.map(r => ({
                        week: r['周期']||r['Week']||'', date: r['日期']||'', brand: r['竞品品牌']||'', 
                        dim: r['追踪维度（单选）']||'', fact: r['事实描述']||'', analysis: r['分析']||'', link: r['信息源']||''
                    })).filter(i => i.brand && i.fact);
                    initApp();
                }
            });
        }

        function initApp() {
            document.getElementById('loading').style.display = 'none';
            
            // 1. 生成顶部品牌 Tab
            const brands = ['All', ...new Set(rawData.map(i => i.brand))];
            const navContainer = document.getElementById('topBrandNav');
            
            brands.forEach((brand, index) => {
                const div = document.createElement('div');
                div.className = `nav-tab ${index === 0 ? 'active' : ''}`;
                div.textContent = brand;
                div.onclick = function() {
                    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentBrandFilter = brand === 'All' ? 'all' : brand;
                    renderFeed();
                    // 点击后自动滚回顶部，提升体验
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                navContainer.appendChild(div);
            });

            // 2. 生成周期下拉框
            const weeks = [...new Set(rawData.map(i => i.week))].sort().reverse();
            weeks.forEach(w => document.getElementById('weekFilter').add(new Option(w, w)));

            renderFeed();
        }

        function renderFeed() {
            const wVal = document.getElementById('weekFilter').value;
            const filtered = rawData.filter(item => 
                (currentBrandFilter === 'all' || item.brand === currentBrandFilter) &&
                (wVal === 'all' || item.week === wVal)
            );
            
            const container = document.getElementById('contentFeed');
            container.innerHTML = '';

            if (filtered.length === 0) {
                container.innerHTML = `<div class="py-20 text-center text-gray-400 text-sm">No updates found for this filter.</div>`;
                return;
            }

            // 按周分组
            const groups = filtered.reduce((acc, curr) => { (acc[curr.week] = acc[curr.week] || []).push(curr); return acc; }, {});
            
            Object.keys(groups).sort().reverse().forEach(week => {
                // 周标题 (作为分隔符)
                const header = document.createElement('div');
                header.className = "sticky top-[63px] z-30 bg-white/95 py-3 mt-4 mb-2 border-b border-gray-100 text-xs font-bold text-gray-400 uppercase tracking-widest backdrop-blur";
                header.textContent = week;
                container.appendChild(header);

                groups[week].forEach(item => {
                    const linkHtml = item.link ? 
                        `<a href="${item.link}" target="_blank" class="inline-flex items-center gap-1 text-sm font-medium text-blue-600 hover:text-blue-800 hover:underline decoration-1 underline-offset-4 mt-3">
                            Read Source <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                         </a>` : '';

                    const div = document.createElement('div');
                    div.className = "feed-item group";
                    div.innerHTML = `
                        <div class="pt-1">
                            <div class="text-sm font-semibold text-gray-900 mb-1">${item.brand}</div>
                            <div class="text-xs text-gray-400 font-mono mb-3">${item.date}</div>
                            <span class="tag">${item.dim}</span>
                        </div>
                        
                        <div>
                            <h3 class="text-lg font-bold text-gray-900 leading-snug mb-3 group-hover:text-blue-600 transition-colors cursor-pointer">${item.fact}</h3>
                            
                            <div class="text-[15px] text-gray-600 leading-relaxed text-justify">
                                ${item.analysis}
                            </div>

                            ${linkHtml}
                        </div>
                    `;
                    container.appendChild(div);
                });
            });
        }

        loadData();
    </script>
</body>
</html>
