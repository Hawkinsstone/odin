<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>竞品追踪周报 | 欧帝科技</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    
    <style>
        body { 
            font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif; 
            background-color: #eef2f6; /* 更浅的背景色 */
            color: #334155; 
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-nav {
            background: rgba(255, 255, 255, 0.8); /* 更透明 */
            backdrop-filter: blur(25px); /* 更强的毛玻璃 */
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.4);
        }
        .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-3px); box-shadow: 0 12px 24px -8px rgba(0,0,0,0.1); border-color: #cbd5e1; }
        
        .custom-select-wrapper { position: relative; flex-shrink: 0; }
        .custom-select {
            appearance: none;
            -webkit-appearance: none;
            background-color: #f1f5f9;
            border: 1px solid transparent;
            padding: 8px 32px 8px 14px;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.5;
            white-space: nowrap;
        }
        .custom-select:hover { background-color: #e2e8f0; color: #1e293b; }
        .custom-select:focus { outline: none; background-color: #fff; border-color: #f97316; box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1); }
        
        .select-arrow { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; color: #94a3b8; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .tag-base { font-size: 0.75rem; padding: 2px 8px; border-radius: 6px; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap; }
        .tag-strategy { background-color: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; } /* 蓝色系 */
        .tag-product { background-color: #dcfce7; color: #22c55e; border: 1px solid #bbf7d0; } /* 绿色系 */
        .tag-market { background-color: #fef2f2; color: #ef4444; border: 1px solid #fecaca; } /* 红色系 */
        .brand-badge { font-weight: 600; border-radius: 6px; padding: 3px 10px; font-size: 0.75rem; display: inline-flex; align-items: center; white-space: nowrap; }

        #loading { position: fixed; inset: 0; background:#f8fafc; display:flex; justify-content:center; align-items:center; z-index:100; }
        .loader { width: 40px; height: 40px; border: 3px solid #e2e8f0; border-top-color: #f97316; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 全局毛玻璃效果容器 */
        .glass-container {
            background: rgba(255, 255, 255, 0.6); /* 半透明背景 */
            backdrop-filter: blur(15px); /* 虚化强度 */
            -webkit-backdrop-filter: blur(15px);
            border-radius: 1.5rem; /* 大圆角 */
            padding: 1.5rem; /* 内边距 */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); /* 柔和阴影 */
            border: 1px solid rgba(255, 255, 255, 0.3); /* 边框 */
        }

        /* 优化 Chart.js DataLabels 字体 */
        .chartjs-datalabels {
            font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif !important;
        }
    </style>
</head>
<body class="antialiased selection:bg-orange-100 selection:text-orange-600 pb-10">

    <div id="loading">
        <div class="flex flex-col items-center gap-3">
            <div class="loader"></div>
            <div class="text-slate-400 text-sm font-medium animate-pulse">Loading Data...</div>
        </div>
    </div>

    <header class="glass-nav sticky top-0 z-50 w-full">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3 sm:gap-4">
                <img src="./logo.png" alt="欧帝科技" class="h-6 sm:h-7 w-auto object-contain opacity-95">
                <div class="h-4 w-[1.5px] bg-slate-200 rotate-12 hidden sm:block"></div>
                <div class="flex items-baseline gap-2 sm:gap-3">
                    <h1 class="text-base sm:text-lg font-bold text-slate-800 tracking-tight">竞品追踪周报</h1>
                    <span id="dateRange" class="hidden sm:inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-500 border border-slate-200">--/--</span>
                </div>
            </div>
            <div class="flex items-center">
                <div class="flex items-center gap-2 bg-white border border-slate-200 px-2 sm:px-3 py-1 rounded-full shadow-sm">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                    </span>
                    <span class="text-xs font-medium text-slate-500 hidden sm:inline" id="updateTime">同步中</span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 mb-6 sm:mb-8 glass-container !p-4 sm:!p-6">
            <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-xs sm:text-sm font-bold text-slate-700 uppercase tracking-wider flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-blue-500"></div>
                        声量分布
                    </h3>
                </div>
                <div class="h-48 sm:h-56"><canvas id="brandChart"></canvas></div>
            </div>
            <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-xs sm:text-sm font-bold text-slate-700 uppercase tracking-wider flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-orange-500"></div>
                        维度占比
                    </h3>
                </div>
                <div class="h-48 sm:h-56 relative flex items-center justify-center">
                    <canvas id="dimensionChart"></canvas>
                    <div id="dimensionCenterText" class="absolute text-center text-slate-600 font-semibold pointer-events-none text-xs sm:text-sm"></div>
                </div>
            </div>
        </div>

        <div class="bg-white py-3 px-2 sm:p-2 rounded-xl sm:rounded-2xl shadow-sm border border-slate-100 mb-6 sm:mb-8 sticky top-16 sm:top-20 z-40 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 glass-container !p-2 sm:!p-2">
            
            <div class="flex items-center gap-2 w-full sm:w-auto overflow-x-auto no-scrollbar px-2 pb-1 sm:pb-0">
                <div class="flex items-center text-slate-400 mr-1 flex-shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                </div>

                <div class="custom-select-wrapper">
                    <select id="weekFilter" onchange="renderCards()" class="custom-select pr-8 sm:pr-10">
                        <option value="all">📅 周期</option>
                    </select>
                    <svg class="select-arrow w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>

                <div class="custom-select-wrapper">
                    <select id="brandFilter" onchange="renderCards()" class="custom-select pr-8 sm:pr-10">
                        <option value="all">🏢 品牌</option>
                    </select>
                    <svg class="select-arrow w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>

                <div class="custom-select-wrapper">
                    <select id="typeFilter" onchange="renderCards()" class="custom-select pr-8 sm:pr-10">
                        <option value="all">🎯 维度</option>
                        <option value="产品与技术">产品与技术</option>
                        <option value="市场与营销">市场与营销</option>
                        <option value="公司与战略">公司与战略</option>
                    </select>
                    <svg class="select-arrow w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
            </div>
            
            <div class="flex items-center gap-2 px-4 w-full sm:w-auto justify-end border-t sm:border-t-0 sm:border-l border-slate-100 pt-2 sm:pt-0 h-auto sm:h-8">
                <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Total</span>
                <span id="countDisplay" class="text-base sm:text-lg font-bold text-slate-800 font-mono">0</span>
            </div>
        </div>

        <div id="contentFeed" class="space-y-8 sm:space-y-12"></div>

        <footer class="mt-12 sm:mt-20 pb-4 sm:pb-8 text-center">
            <div class="inline-flex items-center gap-2 px-3 py-1.5 sm:px-4 sm:py-2 rounded-full bg-white border border-slate-100 shadow-sm">
                <span class="w-1.5 h-1.5 rounded-full bg-slate-300"></span>
                <p class="text-[10px] sm:text-xs text-slate-400 font-medium">Internal Use Only · 欧帝科技市场部</p>
            </div>
        </footer>
    </main>

    <script>
        // 注册 Chart.js DataLabels 插件
        Chart.register(ChartDataLabels);

        const GOOGLE_SHEET_CSV_URL = "./data.csv"; 
        let rawData = [];

        // 定义一组多巴胺风格的颜色
        const DOPAMINE_COLORS = [
            '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40', '#6A0572', 
            '#88B04B', '#FFD700', '#D400FF', '#00FFFF', '#FF00FF', '#FF4500', '#ADFF2F'
        ];

        function getRandomColor(index) {
            return DOPAMINE_COLORS[index % DOPAMINE_COLORS.length];
        }

        function loadData() {
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    rawData = results.data.map(row => ({
                        week: row['周期'] || row['Week'] || '未知',
                        date: row['日期'] || row['Date'] || '',
                        brand: row['竞品品牌'] || row['Brand'] || '其他',
                        dim: row['追踪维度（单选）'] || row['Dimension'] || '其他',
                        fact: row['事实描述'] || row['Fact'] || '无描述',
                        analysis: row['分析'] || row['Analysis'] || '',
                        link: row['信息源'] || row['Link'] || ''
                    })).filter(item => item.brand && item.fact);

                    initApp();
                },
                error: function(err) { console.error(err); }
            });
        }

        function initApp() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('updateTime').textContent = "Updated: " + new Date().toLocaleDateString(undefined, {month:'short', day:'numeric'});

            const weeks = [...new Set(rawData.map(i => i.week))].sort().reverse();
            const brands = [...new Set(rawData.map(i => i.brand))];
            
            const wSelect = document.getElementById('weekFilter');
            weeks.forEach(w => wSelect.add(new Option(w, w)));
            
            const bSelect = document.getElementById('brandFilter');
            brands.forEach(b => bSelect.add(new Option(b, b)));

            if(weeks.length > 0) document.getElementById('dateRange').textContent = `${weeks[weeks.length-1]} ~ ${weeks[0]}`;

            renderCharts();
            renderCards();
        }

        function renderCharts() {
            const brandCounts = {};
            rawData.forEach(i => brandCounts[i.brand] = (brandCounts[i.brand] || 0) + 1);
            const dimCounts = {};
            rawData.forEach(i => dimCounts[i.dim] = (dimCounts[i.dim] || 0) + 1);

            // 1. 声量分布：多巴胺风格多彩柱状图
            const brandChartCtx = document.getElementById('brandChart').getContext('2d');
            const brandChartColors = Object.keys(brandCounts).map((_, index) => getRandomColor(index));
            
            new Chart(brandChartCtx, {
                type: 'bar',
                data: {
                    labels: Object.keys(brandCounts),
                    datasets: [{
                        label: 'Count',
                        data: Object.values(brandCounts),
                        backgroundColor: brandChartColors, // 每个柱子不同颜色
                        hoverBackgroundColor: brandChartColors.map(c => c + 'E6'), // 悬停时加深
                        borderRadius: 6, // 圆角更明显
                        barThickness: window.innerWidth < 640 ? 16 : 28
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    if (context.parsed.y !== null) {
                                        label += context.parsed.y + ' 条';
                                    }
                                    return label;
                                }
                            }
                        }
                    },
                    scales: {
                        y: { 
                            beginAtZero: true, 
                            grid: { color: 'rgba(226, 232, 240, 0.5)' }, // 更淡的网格线
                            border: { display: false }, 
                            ticks: { font: { size: 10, family: "'Noto Sans SC'" } } 
                        },
                        x: { 
                            grid: { display: false }, 
                            border: { display: false }, 
                            ticks: { font: { size: 10, family: "'Noto Sans SC'" }, maxRotation: 45, minRotation: 0 } 
                        }
                    }
                }
            });

            // 2. 维度占比：多巴胺风格甜甜圈图 + 内部文字
            const dimChartCtx = document.getElementById('dimensionChart');
            const dimChartColors = Object.keys(dimCounts).map((_, index) => getRandomColor(index + 3)); // 偏移一下颜色
            const totalDimCount = Object.values(dimCounts).reduce((sum, current) => sum + current, 0);

            if (window.dimensionChartInstance) { // 销毁旧实例，避免重复渲染
                window.dimensionChartInstance.destroy();
            }

            window.dimensionChartInstance = new Chart(dimChartCtx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(dimCounts),
                    datasets: [{
                        data: Object.values(dimCounts),
                        backgroundColor: dimChartColors, 
                        borderWidth: 0, // 移除边框，让颜色更流畅
                        hoverOffset: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '72%',
                    plugins: { 
                        legend: { 
                            position: 'right', 
                            labels: { usePointStyle: true, pointStyle: 'circle', boxWidth: 8, font: { size: 11, family: "'Noto Sans SC'" } } 
                        },
                        datalabels: { // DataLabels Plugin 配置
                            formatter: (value, ctx) => {
                                let percentage = (value * 100 / totalDimCount).toFixed(1) + '%';
                                return percentage;
                            },
                            color: '#fff', // 标签颜色
                            font: {
                                weight: 'bold',
                                size: 10,
                                family: "'Noto Sans SC'"
                            },
                            padding: 6,
                            borderRadius: 4,
                            backgroundColor: (ctx) => ctx.dataset.backgroundColor[ctx.dataIndex] // 标签背景色与扇区颜色一致
                        }
                    },
                    onHover: (event, chartElements) => {
                        const centerTextDiv = document.getElementById('dimensionCenterText');
                        if (chartElements.length > 0) {
                            const dataIndex = chartElements[0].index;
                            const dataset = window.dimensionChartInstance.data.datasets[0];
                            const label = window.dimensionChartInstance.data.labels[dataIndex];
                            const value = dataset.data[dataIndex];
                            const percentage = (value * 100 / totalDimCount).toFixed(1);
                            centerTextDiv.innerHTML = `<div class="text-xs sm:text-sm font-semibold">${label}</div><div class="text-lg sm:text-xl font-bold mt-1 text-slate-800">${percentage}%</div>`;
                        } else {
                            centerTextDiv.innerHTML = `<div class="text-xs sm:text-sm text-slate-400">总计</div><div class="text-xl sm:text-2xl font-bold mt-1 text-slate-800">${totalDimCount}</div>`;
                        }
                    }
                }
            });

            // 初始化中心文字
            document.getElementById('dimensionCenterText').innerHTML = `<div class="text-xs sm:text-sm text-slate-400">总计</div><div class="text-xl sm:text-2xl font-bold mt-1 text-slate-800">${totalDimCount}</div>`;

        }

        function renderCards() {
            const weekVal = document.getElementById('weekFilter').value;
            const brandVal = document.getElementById('brandFilter').value;
            const typeVal = document.getElementById('typeFilter').value;
            const container = document.getElementById('contentFeed');
            container.innerHTML = '';

            const filtered = rawData.filter(item => 
                (weekVal === 'all' || item.week === weekVal) &&
                (brandVal === 'all' || item.brand === brandVal) &&
                (typeVal === 'all' || item.dim === typeVal)
            );

            document.getElementById('countDisplay').textContent = filtered.length;

            const groups = filtered.reduce((acc, curr) => { (acc[curr.week] = acc[curr.week] || []).push(curr); return acc; }, {});
            
            Object.keys(groups).sort().reverse().forEach(week => {
                const header = document.createElement('div');
                header.className = "flex items-center space-x-3 mt-4 mb-4 sm:mb-6";
                header.innerHTML = `
                    <span class="bg-slate-800 text-white text-[10px] sm:text-xs font-bold px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-md shadow-sm tracking-wide">${week}</span>
                    <div class="h-px bg-slate-200 flex-grow"></div>
                `;
                container.appendChild(header);

                const grid = document.createElement('div');
                grid.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6";
                
                groups[week].forEach(item => {
                    let brandStyle = 'bg-slate-100 text-slate-600 border-slate-200';
                    if(['华为','新华三'].some(k=>item.brand.includes(k))) brandStyle = 'bg-rose-50 text-rose-600 border-rose-100';
                    if(['腾讯','浪潮'].some(k=>item.brand.includes(k))) brandStyle = 'bg-blue-50 text-blue-600 border-blue-100';
                    if(['阿里','金智'].some(k=>item.brand.includes(k))) brandStyle = 'bg-orange-50 text-orange-600 border-orange-100';
                    if(['字节','联想'].some(k=>item.brand.includes(k))) brandStyle = 'bg-cyan-50 text-cyan-600 border-cyan-100';

                    let dimClass = 'tag-market';
                    if(item.dim.includes('战略')) dimClass = 'tag-strategy';
                    if(item.dim.includes('产品')) dimClass = 'tag-product';

                    const linkHtml = item.link ? 
                        `<a href="${item.link}" target="_blank" class="inline-flex items-center text-xs font-semibold text-blue-600 hover:text-orange-500 transition-colors mt-3 sm:mt-4 pt-3 sm:pt-4 border-t border-slate-50 w-full">
                            阅读详情 <svg class="w-3 h-3 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                         </a>` : '';

                    const card = document.createElement('div');
                    card.className = "bg-white rounded-xl p-4 sm:p-6 border border-slate-100 shadow-sm card-hover flex flex-col h-full relative overflow-hidden group";
                    card.innerHTML = `
                        <div class="absolute top-0 left-0 w-1 h-full ${dimClass.replace(/bg-|text-|border-/g, '').includes('green') ? 'bg-green-500' : (dimClass.includes('blue') ? 'bg-blue-500' : 'bg-red-500')} opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        
                        <div class="flex justify-between items-start mb-3 sm:mb-4">
                            <span class="brand-badge border ${brandStyle}">${item.brand}</span>
                            <span class="tag-base ${dimClass}">${item.dim}</span>
                        </div>
                        
                        <h4 class="text-[14px] sm:text-[15px] font-bold text-slate-800 leading-relaxed mb-3 line-clamp-2 group-hover:text-orange-600 transition-colors" title="${item.fact}">${item.fact}</h4>
                        
                        <div class="bg-slate-50/80 p-2.5 sm:p-3 rounded-lg border border-slate-100/50 mb-auto">
                            <p class="text-xs leading-relaxed text-slate-500 text-justify">${item.analysis}</p>
                        </div>

                        ${linkHtml}

                        <div class="mt-3 flex items-center justify-end text-[10px] text-slate-300 font-medium">
                           ${item.date}
                        </div>
                    `;
                    grid.appendChild(card);
                });
                container.appendChild(grid);
            });
        }

        loadData();
    </script>
</body>
</html>
