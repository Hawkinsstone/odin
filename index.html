<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>竞品追踪周报 | 欧帝科技</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    
    <style>
        /* === 全局深色主题定义 === */
        body { 
            font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif; 
            background-color: #0f172a; /* Slate-900 */
            /* 酷炫的深空背景渐变 */
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
            color: #e2e8f0; /* Slate-200 */
            -webkit-font-smoothing: antialiased;
        }

        /* === 科技感毛玻璃卡片 === */
        .tech-card {
            background: rgba(30, 41, 59, 0.4); /* 深色半透明 */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08); /*极其微弱的白边*/
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            border-radius: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* 悬停发光效果 */
        .tech-card:hover {
            background: rgba(30, 41, 59, 0.6);
            border-color: rgba(56, 189, 248, 0.3); /* 悬停变青色边框 */
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.1); /* 青色光晕 */
            transform: translateY(-2px);
        }

        /* === 顶部导航 === */
        .tech-nav {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* === 下拉筛选框 (深色版) === */
        .custom-select-wrapper { position: relative; flex-shrink: 0; }
        .custom-select {
            appearance: none;
            background-color: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            padding: 6px 32px 6px 14px;
            border-radius: 99px;
            font-size: 0.85rem;
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.2s;
        }
        .custom-select:hover { background-color: rgba(51, 65, 85, 0.8); border-color: rgba(56, 189, 248, 0.5); color: #fff; }
        .custom-select:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
        .select-arrow { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; color: #94a3b8; }

        /* === 霓虹标签系统 === */
        .tag-base { font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; font-weight: 600; letter-spacing: 0.05em; }
        /* 战略：青色霓虹 */
        .tag-strategy { background: rgba(6, 182, 212, 0.15); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.3); }
        /* 产品：紫色霓虹 */
        .tag-product { background: rgba(168, 85, 247, 0.15); color: #e879f9; border: 1px solid rgba(168, 85, 247, 0.3); }
        /* 市场：橙色霓虹 */
        .tag-market { background: rgba(249, 115, 22, 0.15); color: #fdba74; border: 1px solid rgba(249, 115, 22, 0.3); }
        
        /* 品牌胶囊：深色背景+白字 */
        .brand-badge { font-weight: 600; border-radius: 4px; padding: 2px 8px; font-size: 0.7rem; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); color: #f1f5f9; }

        /* 滚动条隐藏 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Logo 自动变白滤镜 (防止用户logo是黑色的看不清) */
        .logo-white-filter { filter: brightness(0) invert(1) opacity(0.9); }

        /* 加载动画 */
        #loading { position: fixed; inset: 0; background:#0f172a; display:flex; justify-content:center; align-items:center; z-index:100; }
        .loader { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #38bdf8; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="pb-12">

    <div id="loading">
        <div class="flex flex-col items-center gap-3">
            <div class="loader"></div>
            <div class="text-slate-500 text-xs font-mono animate-pulse">SYSTEM INITIALIZING...</div>
        </div>
    </div>

    <header class="tech-nav sticky top-0 z-50 w-full">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <img src="./logo.png" alt="欧帝科技" class="h-6 w-auto object-contain logo-white-filter">
                <div class="h-4 w-[1px] bg-slate-700 rotate-12 hidden sm:block"></div>
                <div class="flex items-baseline gap-3">
                    <h1 class="text-lg font-bold text-white tracking-wider uppercase">Competitive Intel</h1>
                    <span id="dateRange" class="hidden sm:inline-flex text-[10px] font-mono text-cyan-400 border border-cyan-900/50 bg-cyan-950/30 px-2 py-0.5 rounded">--/--</span>
                </div>
            </div>
            <div class="flex items-center">
                <div class="flex items-center gap-2 px-3 py-1 rounded-full border border-green-500/20 bg-green-500/10">
                    <span class="relative flex h-1.5 w-1.5">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-green-500"></span>
                    </span>
                    <span class="text-[10px] font-mono text-green-400 hidden sm:inline" id="updateTime">ONLINE</span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="tech-card p-6">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-sm font-bold text-slate-300 uppercase tracking-widest flex items-center gap-2">
                        <span class="w-1 h-4 bg-cyan-500 shadow-[0_0_10px_#06b6d4]"></span>
                        Brand Volume
                    </h3>
                </div>
                <div class="h-52"><canvas id="brandChart"></canvas></div>
            </div>
            <div class="tech-card p-6 relative">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-sm font-bold text-slate-300 uppercase tracking-widest flex items-center gap-2">
                        <span class="w-1 h-4 bg-purple-500 shadow-[0_0_10px_#a855f7]"></span>
                        Dimensions
                    </h3>
                </div>
                <div class="h-52 flex items-center justify-center relative">
                    <canvas id="dimensionChart"></canvas>
                    <div id="dimensionCenterText" class="absolute text-center pointer-events-none"></div>
                </div>
            </div>
        </div>

        <div class="tech-card mb-8 sticky top-20 z-40 p-3 flex flex-col sm:flex-row items-center justify-between gap-4 border-t border-white/10">
            <div class="flex items-center gap-3 w-full sm:w-auto overflow-x-auto no-scrollbar px-1">
                <div class="flex items-center text-cyan-500 mr-1 flex-shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                </div>
                <div class="custom-select-wrapper">
                    <select id="weekFilter" onchange="renderCards()" class="custom-select pr-8"><option value="all">周期 (All)</option></select>
                    <svg class="select-arrow w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
                <div class="custom-select-wrapper">
                    <select id="brandFilter" onchange="renderCards()" class="custom-select pr-8"><option value="all">品牌 (All)</option></select>
                    <svg class="select-arrow w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
                <div class="custom-select-wrapper">
                    <select id="typeFilter" onchange="renderCards()" class="custom-select pr-8"><option value="all">维度 (All)</option></select>
                    <svg class="select-arrow w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
            </div>
            
            <div class="flex items-center gap-3 px-4 border-l border-white/10 h-8">
                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Total Records</span>
                <span id="countDisplay" class="text-xl font-mono font-bold text-cyan-400 text-shadow-neon">0</span>
            </div>
        </div>

        <div id="contentFeed" class="space-y-6"></div>

        <footer class="mt-16 pb-8 text-center border-t border-white/5 pt-8">
            <p class="text-[10px] text-slate-600 font-mono uppercase">Odin Tech Intelligence System · Internal Access Only</p>
        </footer>
    </main>

    <script>
        Chart.register(ChartDataLabels);
        
        // 🔴 全局 Chart.js 暗黑模式配置 🔴
        Chart.defaults.color = '#94a3b8'; // 文字颜色变灰
        Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.05)'; // 网格线极淡
        
        const GOOGLE_SHEET_CSV_URL = "./data.csv"; 
        let rawData = [];

        function loadData() {
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true, header: true, skipEmptyLines: true,
                complete: function(results) {
                    rawData = results.data.map(row => ({
                        week: row['周期']||row['Week']||'Unknown', date: row['日期']||'', brand: row['竞品品牌']||'', 
                        dim: row['追踪维度（单选）']||'', fact: row['事实描述']||'', analysis: row['分析']||'', link: row['信息源']||''
                    })).filter(item => item.brand && item.fact);
                    initApp();
                }
            });
        }

        function initApp() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('updateTime').textContent = "UPDATED: " + new Date().toLocaleDateString();
            const weeks = [...new Set(rawData.map(i => i.week))].sort().reverse();
            const brands = [...new Set(rawData.map(i => i.brand))];
            weeks.forEach(w => document.getElementById('weekFilter').add(new Option(w, w)));
            brands.forEach(b => document.getElementById('brandFilter').add(new Option(b, b)));
            if(weeks.length) document.getElementById('dateRange').textContent = `${weeks[weeks.length-1]} -> ${weeks[0]}`;
            renderCharts();
            renderCards();
        }

        function renderCharts() {
            const brandCounts = {}; rawData.forEach(i => brandCounts[i.brand] = (brandCounts[i.brand] || 0) + 1);
            const dimCounts = {}; rawData.forEach(i => dimCounts[i.dim] = (dimCounts[i.dim] || 0) + 1);

            // 1. 柱状图：赛博朋克霓虹渐变
            const ctxBrand = document.getElementById('brandChart').getContext('2d');
            const gradientBrand = ctxBrand.createLinearGradient(0, 0, 0, 400);
            gradientBrand.addColorStop(0, '#22d3ee'); // 青色
            gradientBrand.addColorStop(1, '#3b82f6'); // 蓝色

            new Chart(ctxBrand, {
                type: 'bar',
                data: {
                    labels: Object.keys(brandCounts),
                    datasets: [{
                        data: Object.values(brandCounts),
                        backgroundColor: gradientBrand,
                        hoverBackgroundColor: '#67e8f9',
                        borderRadius: 2,
                        barThickness: window.innerWidth < 640 ? 12 : 20
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: {display:false}, datalabels: {display:false} },
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { font: {family: 'Noto Sans SC'} } },
                        x: { grid: { display: false } }
                    }
                }
            });

            // 2. 甜甜圈图：霓虹色系
            const total = Object.values(dimCounts).reduce((a,b)=>a+b,0);
            // 颜色：青色, 紫色, 粉红
            const neonColors = ['#06b6d4', '#8b5cf6', '#ec4899', '#f59e0b'];
            
            window.dimChart = new Chart(document.getElementById('dimensionChart'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(dimCounts),
                    datasets: [{
                        data: Object.values(dimCounts),
                        backgroundColor: neonColors,
                        borderWidth: 0,
                        hoverOffset: 10
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, cutout: '75%',
                    plugins: { 
                        legend: { position: 'right', labels: { color:'#94a3b8', usePointStyle: true, pointStyle: 'circle', boxWidth: 6, font: {size: 10} } },
                        datalabels: { color: '#fff', font: {weight:'bold'}, formatter: (v)=>Math.round(v/total*100)+'%' }
                    },
                    onHover: (e, els) => {
                        const center = document.getElementById('dimensionCenterText');
                        if(els.length) {
                            const i = els[0].index;
                            center.innerHTML = `<div class="text-xs text-slate-400">${window.dimChart.data.labels[i]}</div><div class="text-xl font-bold text-white text-shadow-neon">${Math.round(window.dimChart.data.datasets[0].data[i]/total*100)}%</div>`;
                        } else {
                            center.innerHTML = `<div class="text-xs text-slate-500">TOTAL</div><div class="text-xl font-bold text-white">${total}</div>`;
                        }
                    }
                }
            });
            document.getElementById('dimensionCenterText').innerHTML = `<div class="text-xs text-slate-500">TOTAL</div><div class="text-xl font-bold text-white">${total}</div>`;
        }

        function renderCards() {
            const weekVal = document.getElementById('weekFilter').value;
            const brandVal = document.getElementById('brandFilter').value;
            const typeVal = document.getElementById('typeFilter').value;
            const container = document.getElementById('contentFeed');
            container.innerHTML = '';

            const filtered = rawData.filter(item => 
                (weekVal === 'all' || item.week === weekVal) && (brandVal === 'all' || item.brand === brandVal) && (typeVal === 'all' || item.dim === typeVal)
            );
            document.getElementById('countDisplay').textContent = filtered.length;

            const groups = filtered.reduce((acc, curr) => { (acc[curr.week] = acc[curr.week] || []).push(curr); return acc; }, {});
            
            Object.keys(groups).sort().reverse().forEach(week => {
                const header = document.createElement('div');
                header.className = "flex items-center space-x-3 mt-8 mb-4";
                header.innerHTML = `<span class="bg-slate-800 border border-slate-700 text-cyan-500 text-[10px] font-bold px-3 py-1 rounded shadow-sm font-mono">WEEK ${week}</span><div class="h-[1px] bg-slate-800 flex-grow"></div>`;
                container.appendChild(header);

                const grid = document.createElement('div');
                grid.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6";
                groups[week].forEach(item => {
                    let dimClass = 'tag-market';
                    if(item.dim.includes('战略')) dimClass = 'tag-strategy';
                    if(item.dim.includes('产品')) dimClass = 'tag-product';

                    const linkHtml = item.link ? 
                        `<a href="${item.link}" target="_blank" class="inline-flex items-center text-xs font-bold text-cyan-500 hover:text-cyan-300 mt-4 pt-4 border-t border-white/5 w-full transition-colors">
                            ACCESS SOURCE <svg class="w-3 h-3 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                         </a>` : '';

                    const card = document.createElement('div');
                    card.className = "tech-card p-5 flex flex-col h-full group";
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-4">
                            <span class="brand-badge">${item.brand}</span>
                            <span class="tag-base ${dimClass}">${item.dim}</span>
                        </div>
                        <h4 class="text-[14px] font-bold text-slate-200 leading-relaxed mb-3 line-clamp-2 group-hover:text-cyan-100 transition-colors" title="${item.fact}">${item.fact}</h4>
                        <div class="bg-slate-900/50 p-3 rounded border border-white/5 mb-auto">
                            <p class="text-xs text-slate-400 text-justify leading-relaxed font-light">${item.analysis}</p>
                        </div>
                        ${linkHtml}
                        <div class="mt-3 text-[9px] text-slate-600 font-mono text-right tracking-wider">${item.date}</div>
                    `;
                    grid.appendChild(card);
                });
                container.appendChild(grid);
            });
        }
        loadData();
    </script>
</body>
</html>
